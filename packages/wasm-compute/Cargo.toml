[package]
name = "wasm-compute"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Exact: the committed pkg/ and pkg-simd/ glue was generated by this bindgen, and
# Cargo.lock is not tracked. `bun run wasm:verify` compares the artifacts with it.
wasm-bindgen = "=0.2.128"
console_error_panic_hook = "0.1.7"
js-sys = "0.3"
