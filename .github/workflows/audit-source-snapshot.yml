name: Audit Source Snapshot

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/audit-source-snapshot.yml

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Create tracked-source archive
        run: git archive --format=zip --output=phage-explorer-source.zip HEAD

      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: phage-explorer-audit-source
          path: phage-explorer-source.zip
          retention-days: 1
          if-no-files-found: error
