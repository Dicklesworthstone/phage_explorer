name: Release

# Triggered by version tags. Builds the wasm-compute Rust package via
# wasm-pack, then compiles the Bun TUI into platform-specific single-file
# binaries (one cross-target per matrix runner) and publishes them as
# GitHub release assets under the names install.sh expects:
#   phage-explorer-linux-x64
#   phage-explorer-linux-arm64
#   phage-explorer-macos-x64
#   phage-explorer-macos-arm64
#   phage-explorer-windows-x64.exe

# NOTE: the tag trigger is intentionally disabled.
#
# Both this workflow and ci.yml fired on `v*` and both called
# action-gh-release, so a single tag started two workflows racing to create the
# same release. ci.yml is the proven path -- it produced the v1.4.1 assets
# (binaries, phage.db, sha256.txt, and notably no cosign signatures, which are
# this workflow's fingerprint). This workflow has never run on a real tag: it
# was added in de580ce in April 2026, and the release pipeline has been jammed
# ever since, so it has no successful run to its name.
#
# It is kept on workflow_dispatch because it has capabilities ci.yml lacks
# (cosign signing, homebrew tap dispatch) that are worth adopting. Adopt them by
# moving those steps into ci.yml, or by proving this workflow with a manual
# dispatch and then swapping which one owns the tag trigger -- not by having
# both listen at once.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
            asset: phage-explorer-linux-x64
          - os: ubuntu-24.04-arm
            target: linux-arm64
            asset: phage-explorer-linux-arm64
          - os: macos-15-intel
            target: mac-x64
            asset: phage-explorer-macos-x64
          - os: macos-14
            target: mac-arm64
            asset: phage-explorer-macos-arm64
          - os: windows-latest
            target: windows-x64
            asset: phage-explorer-windows-x64.exe

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Read the channel from packages/wasm-compute/rust-toolchain.toml rather
      # than hardcoding `stable` here. The two must agree or the artifacts this
      # job builds will not match the ones `bun run wasm:verify` accepts, which
      # is the drift the pin exists to prevent.
      - name: Read pinned Rust channel
        id: rust-pin
        shell: bash
        run: |
          channel=$(grep -oP 'channel\s*=\s*"\K[^"]+' packages/wasm-compute/rust-toolchain.toml)
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "Pinned Rust channel: $channel"

      - name: Install Rust toolchain (for wasm-pack)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust-pin.outputs.channel }}
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        # Cargo install on macOS/linux runners; on Windows use the bundled
        # MSVC toolchain. wasm-pack 0.13+ supports all three.
        run: cargo install wasm-pack --locked --version ^0.13

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The committed .wasm files must have been produced by the pinned
      # toolchain. When they were not, the inline-patch script silently no-ops
      # against unfamiliar bindgen output and ships glue that does not match the
      # binary, with no signal anywhere.
      - name: Verify committed WASM matches the pinned toolchain
        shell: bash
        run: bun run wasm:verify

      # The crate has 36 Rust tests across six #[cfg(test)] modules and no
      # workflow had ever run them. They cover the kernels' own invariants,
      # which is the layer below the JS-parity suites.
      - name: Run Rust kernel tests
        shell: bash
        run: bun run wasm:test

      # Coarse net, deliberately. It gates on one thing: a kernel that was
      # clearly faster in WASM becoming SLOWER than JavaScript, which is the
      # signature of the WASM path no longer being taken. Absolute times on a
      # shared runner vary too much to gate on -- MinHash measured 20.9x on a
      # quiet machine and 1.8x under load -- and a benchmark gate that fires on
      # load gets disabled.
      - name: Check no kernel lost its WASM advantage
        shell: bash
        run: bun run bench:check

      - name: Typecheck (advisory)
        run: bun run typecheck
        continue-on-error: true

      - name: Compile single-file binary
        run: bun run build:${{ matrix.target }}

      - name: Compute SHA256 (Unix)
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail
          cd dist
          shasum -a 256 "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256"

      - name: Compute SHA256 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Push-Location dist
          $hash = (Get-FileHash -Algorithm SHA256 "${{ matrix.asset }}").Hash.ToLower()
          "$hash  ${{ matrix.asset }}" | Out-File -Encoding ASCII "${{ matrix.asset }}.sha256"
          Pop-Location

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: |
            dist/${{ matrix.asset }}
            dist/${{ matrix.asset }}.sha256

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v6

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      # The database is an ASSET of the release, and nothing staged it.
      #
      # The upload step publishes `dist/*`, and no step ever put phage.db there,
      # so a release cut from this workflow would ship with no database at all.
      # install.sh --with-database would then 404 on both phage.db.gz and
      # phage.db and only warn, leaving the user a TUI with no data. The
      # v1.4.1 release has a 3.1 MB phage.db that predates this workflow.
      #
      # The .gz is what install.sh tries first (3.9 MB against 10.4 MB); the
      # plain file is published too because the installer falls back to it when
      # gunzip is unavailable.
      - name: Stage the phage database
        run: |
          set -euo pipefail
          db="packages/web/public/phage.db"

          # Fail rather than ship a release without data. A missing database is
          # not a degraded release, it is a broken install path.
          [[ -f "$db" ]] || { echo "::error::$db is missing; refusing to publish a release without it"; exit 1; }
          # Gzip is generated/ignored, so a fresh checkout must build it from
          # the same source as the raw DB and transport/content descriptor.
          bun scripts/build-web-db.ts --source "$db" --output dist
          ls -la dist/phage.db dist/phage.db.gz dist/phage.db.manifest.json

          # Guard against publishing the stale 3.1 MB database that v1.4.1
          # shipped, from before Pfam domains, ESM2 embeddings and codon
          # adaptation were added.
          size=$(stat -c%s dist/phage.db 2>/dev/null || stat -f%z dist/phage.db)
          if [[ "$size" -lt 5000000 ]]; then
            echo "::error::dist/phage.db is only $size bytes; the current database is ~10 MB. Refusing to publish a stale one."
            exit 1
          fi

      - name: Generate aggregate sha256.txt
        # install.sh expects this filename verbatim:
        #   https://github.com/$OWNER/$REPO/releases/download/$VERSION/sha256.txt
        # with one `<sha256>  <asset_name>` line per binary asset, then
        # greps for the asset name to find the expected hash.
        run: |
          set -euo pipefail
          shopt -s nullglob
          cd dist
          rm -f sha256.txt
          for f in phage-explorer-* phage.db phage.db.gz phage.db.manifest.json; do
            case "$f" in
              *.sha256|*.sigstore.json|sha256.txt) ;;
              *) [[ -f "$f" ]] && shasum -a 256 "$f" >> sha256.txt ;;
            esac
          done
          cat sha256.txt

          # The database is the asset most worth checksumming: it is the one a
          # user is told to download separately, and a truncated download of a
          # SQLite file fails in confusing ways rather than obviously.
          grep -q ' phage.db$' sha256.txt || { echo "::error::phage.db missing from sha256.txt"; exit 1; }

      - name: Install cosign
        uses: sigstore/cosign-installer@v4.1.1

      - name: Sign release artifacts (sigstore bundle)
        run: |
          set -euo pipefail
          shopt -s nullglob
          cd dist
          for f in phage-explorer-*; do
            case "$f" in
              *.sha256|*.sigstore.json|SHA256SUMS) continue ;;
            esac
            cosign sign-blob --yes --bundle "${f}.sigstore.json" "$f"
          done

      - name: Copy install scripts to dist
        run: |
          cp install.sh dist/ 2>/dev/null || echo "No install.sh found"
          cp install.ps1 dist/ 2>/dev/null || echo "No install.ps1 found"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  notify-homebrew-tap:
    name: Notify Homebrew Tap
    runs-on: ubuntu-latest
    needs: release
    timeout-minutes: 5
    continue-on-error: true
    env:
      HAS_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN != '' }}
    steps:
      - name: Check for token
        id: check
        run: |
          if [[ "${{ env.HAS_TOKEN }}" != "true" ]]; then
            echo "::warning::HOMEBREW_TAP_TOKEN not configured, skipping notification"
            echo "skip=true" >> $GITHUB_OUTPUT
          fi

      - name: Extract version from tag
        if: steps.check.outputs.skip != 'true'
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Trigger formula update
        if: steps.check.outputs.skip != 'true'
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4.0.1
        with:
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          repository: Dicklesworthstone/homebrew-tap
          event-type: formula-update
          client-payload: |
            {
              "tool": "phage-explorer",
              "version": "${{ steps.version.outputs.version }}"
            }
