name: E2E Production Tests

# Run after deployment to Vercel
on:
  deployment_status:

  workflow_dispatch:
    inputs:
      site_url:
        description: 'Site URL to test (default: https://phage-explorer.org)'
        required: false
        default: 'https://phage-explorer.org'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.deployment.environment || 'manual' }}
  cancel-in-progress: true

env:
  BUN_VERSION: "1.4.0"
  PLAYWRIGHT_BASE_URL: ${{ github.event.inputs.site_url || 'https://phage-explorer.org' }}

jobs:
  e2e-production:
    name: E2E Tests (${{ matrix.project }})
    runs-on: ubuntu-latest
    if: github.event.deployment_status.state == 'success' || github.event_name == 'workflow_dispatch'

    strategy:
      fail-fast: false
      matrix:
        project:
          - chromium
          - mobile-small
          - mobile-medium
          - mobile-large
          - android-phone
          - mobile-landscape
          - tablet-small
          - tablet-large

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock', 'bun.lockb', 'package.json', 'packages/*/package.json') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('bun.lock', 'bun.lockb', 'package.json', 'packages/*/package.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: bunx playwright install --with-deps chromium

      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: bunx playwright install-deps chromium

      - name: Wait for site to be ready
        run: |
          echo "Waiting for $PLAYWRIGHT_BASE_URL to be ready..."
          site_wait_seconds=60
          while [ "$site_wait_seconds" -gt 0 ]; do
            if curl --silent --show-error --location --fail --max-time 15 --user-agent 'OpenAI File Downloader, XaiImageApiFetch/1.0' --output /dev/null "$PLAYWRIGHT_BASE_URL"; then
              echo "Site is ready!"
              break
            fi
            echo "Waiting... ($site_wait_seconds seconds remaining)"
            sleep 5
            site_wait_seconds=$((site_wait_seconds - 5))
          done
          if [ "$site_wait_seconds" -le 0 ]; then
            echo "Timeout waiting for site"
            exit 1
          fi

      - name: Run E2E tests
        working-directory: packages/web
        env:
          PLAYWRIGHT_LIVE: '1'
          PLAYWRIGHT_BASE_URL: ${{ env.PLAYWRIGHT_BASE_URL }}
        run: |
          bunx playwright test \
            --project=${{ matrix.project }} \
            --reporter=html,json \
            --output=test-results-${{ matrix.project }} \
            2>&1 | tee test-output-${{ matrix.project }}.log

      - name: Capture JavaScript errors
        if: always()
        working-directory: packages/web
        run: |
          echo "## JavaScript Console Errors for ${{ matrix.project }}" > js-errors-${{ matrix.project }}.md
          echo "" >> js-errors-${{ matrix.project }}.md

          if grep -Ei "uncaught|unhandled|pageerror|console error|exception" test-output-${{ matrix.project }}.log 2>/dev/null; then
            echo "Found potential runtime errors in test output:" >> js-errors-${{ matrix.project }}.md
            grep -Ei "uncaught|unhandled|pageerror|console error|exception" test-output-${{ matrix.project }}.log >> js-errors-${{ matrix.project }}.md
          else
            echo "No JavaScript errors detected." >> js-errors-${{ matrix.project }}.md
          fi

          cat js-errors-${{ matrix.project }}.md

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results-${{ matrix.project }}
          path: |
            packages/web/test-results-${{ matrix.project }}/
            packages/web/playwright-report/
            packages/web/screenshots/
            packages/web/test-output-${{ matrix.project }}.log
            packages/web/js-errors-${{ matrix.project }}.md
          retention-days: 14

      - name: Upload trace on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces-${{ matrix.project }}
          path: packages/web/test-results-${{ matrix.project }}/**/*.zip
          retention-days: 7

  summarize:
    name: Summarize Results
    needs: e2e-production
    runs-on: ubuntu-latest
    if: always()
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          path: artifacts

      - name: Generate summary report
        run: |
          echo "# E2E Production Test Summary" > summary.md
          echo "" >> summary.md
          echo "**Site:** ${{ env.PLAYWRIGHT_BASE_URL }}" >> summary.md
          echo "**Run:** ${{ github.run_id }}" >> summary.md
          echo "**Date:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> summary.md
          echo "" >> summary.md

          echo "## Test Results by Device" >> summary.md
          echo "" >> summary.md

          for device in chromium mobile-small mobile-medium mobile-large android-phone mobile-landscape tablet-small tablet-large; do
            dir="artifacts/playwright-results-$device"
            if [ -d "$dir" ]; then
              log_file="$dir/test-output-$device.log"
              if [ -f "$log_file" ]; then
                if grep -Eq "(^|[^0-9])[1-9][0-9]* failed|\bfailed\b" "$log_file"; then
                  echo "- **$device**: :x: Failed" >> summary.md
                elif grep -Eq "(^|[^0-9])[0-9]+ passed\b" "$log_file"; then
                  echo "- **$device**: :white_check_mark: Passed" >> summary.md
                else
                  echo "- **$device**: :warning: Unknown status" >> summary.md
                fi
              else
                echo "- **$device**: :grey_question: No results" >> summary.md
              fi
            else
              echo "- **$device**: :grey_question: Not run" >> summary.md
            fi
          done

          echo "" >> summary.md
          echo "## JavaScript Errors" >> summary.md
          echo "" >> summary.md

          found_errors=false
          for device in chromium mobile-small mobile-medium mobile-large android-phone mobile-landscape tablet-small tablet-large; do
            error_file="artifacts/playwright-results-$device/js-errors-$device.md"
            if [ -f "$error_file" ]; then
              if ! grep -q "No JavaScript errors detected" "$error_file"; then
                echo "### $device" >> summary.md
                cat "$error_file" >> summary.md
                echo "" >> summary.md
                found_errors=true
              fi
            fi
          done

          if [ "$found_errors" = false ]; then
            echo "No JavaScript errors detected across all devices." >> summary.md
          fi

          cat summary.md

      - name: Create GitHub Issue on failure
        if: needs.e2e-production.result == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const summary = fs.readFileSync('summary.md', 'utf8');
            const issueTitle = `E2E Production Tests Failed - ${new Date().toISOString().split('T')[0]}`;

            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100
            });
            const existingIssue = issues.data.find(
              issue => issue.title.startsWith('E2E Production Tests Failed')
            );
            const runLink = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            if (existingIssue) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existingIssue.number,
                body: `## New Failure - Run #${context.runNumber}\n\n${summary}\n\n[View Run](${runLink})`
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: issueTitle,
                body: `${summary}\n\n[View Run](${runLink})`
              });
            }

      - name: Post summary to workflow
        if: always()
        run: cat summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload summary artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-summary
          path: summary.md
          retention-days: 30

      # This job runs `if: always()` so it can publish a summary and open an
      # issue even when the matrix fails. That is the right behaviour for the
      # reporting steps above, but it also meant the job itself reported
      # SUCCESS when every matrix job had failed -- observed in run
      # 33433415451, where all eight `E2E Tests (...)` jobs failed at dependency
      # install and "Summarize Results" came back green. A workflow whose final
      # job is green while its actual work is red is worse than no workflow: it
      # emits a positive signal from a total failure.
      #
      # Reporting first, then fail. Keep this step last.
      - name: Fail if any matrix job failed
        if: needs.e2e-production.result != 'success'
        run: |
          echo "::error::e2e-production finished with result '${{ needs.e2e-production.result }}'."
          echo "::error::The summary above was still published. Failing so this run does not"
          echo "::error::present as successful."
          exit 1
