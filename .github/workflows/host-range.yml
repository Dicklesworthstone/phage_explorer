name: Measured host-range workflows

on:
  push:
    branches: [main]
    paths:
      - 'packages/core/src/analysis/host-range-evidence*'
      - 'packages/core/src/index.ts'
      - 'packages/tui/src/host-range-cli.test.ts'
      - 'packages/tui/src/index.tsx'
      - 'scripts/host-range.ts'
      - 'packages/web/src/components/overlays/HostRangeEvidencePanel.tsx'
      - 'packages/web/src/components/overlays/CocktailCompatibilityOverlay.tsx'
      - 'packages/web/e2e/host-range-evidence.e2e.ts'
      - 'bun.lock'
      - '.github/workflows/host-range.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-cli:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'
      - run: bun install --frozen-lockfile
      - name: Measured evidence and headless replay regressions
        run: bun test packages/core/src/analysis/host-range-evidence.test.ts packages/tui/src/host-range-cli.test.ts
      - run: bun run lint
      - run: bun run typecheck:all
      - run: bun run check:scripts

      - name: Install browser
        run: bunx playwright install --with-deps chromium
      - name: Build production web application
        run: bun run build:web
      - name: Browser evidence and browser-terminal round trip
        working-directory: packages/web
        run: bunx playwright test --project=chromium --workers=1 e2e/host-range-evidence.e2e.ts
      - name: Retain browser failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: host-range-browser-report
          path: |
            packages/web/playwright-report/
            packages/web/test-results/
          retention-days: 7
