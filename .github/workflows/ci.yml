name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  BUN_VERSION: "1.4.0"

jobs:
  check:
    name: Lint, Typecheck, Test & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock', 'bun.lockb', 'package.json', 'packages/*/package.json') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Run tests
        run: bun run test

      - name: Verify web production build
        run: bun run build:web

  build-release:
    name: Build (${{ matrix.os }})
    needs: check
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            targets: "linux-x64 linux-arm64"
          - os: macos-latest
            targets: "mac-arm64 mac-x64"
          - os: windows-latest
            targets: "windows-x64"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock', 'bun.lockb', 'package.json', 'packages/*/package.json') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build binaries
        shell: bash
        run: |
          mkdir -p dist
          for target in ${{ matrix.targets }}; do
            echo "Building for $target..."
            bun run build:$target
          done

      - name: Verify builds (Unix)
        if: runner.os != 'Windows'
        run: |
          for f in dist/phage-explorer-*; do
            if [[ -f "$f" && ! "$f" == *.exe ]]; then
              chmod +x "$f"
              echo "Verifying $f exists and is executable..."
              ls -la "$f"
              file "$f"
            fi
          done

      - name: Verify builds (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem dist/*.exe | ForEach-Object {
            Write-Host "Verifying $_ exists..."
            Write-Host "Size: $($_.Length) bytes"
            if ($_.Length -lt 1000) {
              throw "Binary too small, build likely failed"
            }
          }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.os }}
          path: dist/phage-explorer-*
          retention-days: 7

  build-database:
    name: Build Database
    needs: check
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock', 'bun.lockb', 'package.json', 'packages/*/package.json') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Ship the database that is committed to the repository, not a fresh
      # `bun run build:db`.
      #
      # `build:db` fetches from NCBI and produces the CORE database only. The
      # committed packages/web/public/phage.db is the output of
      # `build:db:annotated` and additionally carries 1,695 Pfam-A domain hits
      # and 2,039 ESM2 embeddings. Rebuilding here would ship a release whose
      # annotations are a regression against the repository, and would make the
      # release depend on NCBI being up and unthrottled at tag time.
      - name: Verify committed database
        run: |
          DB=packages/web/public/phage.db
          test -s "$DB"
          ls -la "$DB"
          phages=$(sqlite3 "$DB" "SELECT COUNT(*) FROM phages;")
          domains=$(sqlite3 "$DB" "SELECT COUNT(*) FROM protein_domains;")
          embeddings=$(sqlite3 "$DB" "SELECT COUNT(*) FROM fold_embeddings;")
          echo "phages=$phages protein_domains=$domains fold_embeddings=$embeddings"
          # Guard against shipping a stub or a core-only build by accident.
          test "$phages" -eq 24
          test "$domains" -gt 1000
          test "$embeddings" -gt 2000

      - name: Prepare database assets
        run: |
          mkdir -p db-out
          cp packages/web/public/phage.db db-out/phage.db
          # install.sh prefers the compressed asset and falls back to the plain
          # one, so publish both.
          gzip -9 -c db-out/phage.db > db-out/phage.db.gz
          ls -la db-out/

      - name: Upload database artifact
        uses: actions/upload-artifact@v4
        with:
          name: database
          path: db-out/
          retention-days: 7

  release:
    name: Create Release
    needs: [build-release, build-database]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release files
        run: |
          mkdir -p release
          find artifacts -name "phage-explorer-*" -type f -exec cp {} release/ \;
          cp artifacts/database/phage.db release/
          cp artifacts/database/phage.db.gz release/
          chmod +x release/phage-explorer-* 2>/dev/null || true
          ls -la release/

      - name: Generate checksums
        run: |
          cd release
          sha256sum * > sha256.txt
          cat sha256.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*
          generate_release_notes: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
