name: Annotate Phages

on:
  push:
    branches: [main]
    paths:
      - 'packages/data-pipeline/src/phage-catalog.ts'
      - 'scripts/annotation/**'

  schedule:
    - cron: '0 0 * * 0'

  workflow_dispatch:
    inputs:
      skip_domains:
        description: 'Skip InterProScan domain annotation'
        required: false
        default: false
        type: boolean
      limit:
        description: 'Limit genes to annotate (0 = all)'
        required: false
        default: '0'
        type: string

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  BUN_VERSION: "1.4.0"

jobs:
  annotate:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: scripts/annotation/requirements.txt

      - name: Install Python dependencies
        run: python -m pip install -r scripts/annotation/requirements.txt

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock', 'bun.lockb', 'package.json', 'packages/*/package.json') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install JavaScript dependencies
        run: bun install --frozen-lockfile

      - name: Fetch phage sequences from NCBI
        working-directory: packages/data-pipeline
        run: bun run src/build-db.ts
        env:
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}

      - name: Cache annotation results
        uses: actions/cache@v4
        with:
          path: ~/.interpro_cache
          key: ${{ runner.os }}-interpro-${{ hashFiles('packages/data-pipeline/src/phage-catalog.ts', 'scripts/annotation/**') }}
          restore-keys: |
            ${{ runner.os }}-interpro-

      - name: Run annotation pipeline
        env:
          SKIP_DOMAINS: ${{ inputs.skip_domains || false }}
          ANNOTATION_LIMIT: ${{ inputs.limit || '0' }}
        run: |
          set -euo pipefail
          args=(--db packages/data-pipeline/phage.db)

          if [ "$SKIP_DOMAINS" = "true" ]; then
            args+=(--skip-domains)
          fi

          if ! [[ "$ANNOTATION_LIMIT" =~ ^[0-9]+$ ]]; then
            echo "::error::limit must be a non-negative integer"
            exit 2
          fi

          if [ "$ANNOTATION_LIMIT" != "0" ]; then
            args+=(--limit "$ANNOTATION_LIMIT")
          fi

          python scripts/annotation/run_pipeline.py "${args[@]}"

      - name: Build optimized web database
        run: |
          bun run scripts/build-web-db.ts \
            --source packages/data-pipeline/phage.db \
            --output packages/web/public

      - name: Verify database
        run: |
          set -euo pipefail
          test -s packages/web/public/phage.db
          echo "Database size:"
          ls -lh packages/web/public/phage.db

          echo ""
          echo "Table counts:"
          sqlite3 packages/web/public/phage.db "
            SELECT 'phages', COUNT(*) FROM phages
            UNION ALL SELECT 'genes', COUNT(*) FROM genes
            UNION ALL SELECT 'protein_domains', COUNT(*) FROM protein_domains
            UNION ALL SELECT 'amg_annotations', COUNT(*) FROM amg_annotations
            UNION ALL SELECT 'host_trna_pools', COUNT(*) FROM host_trna_pools;
          "

      - name: Commit updated database
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet -- packages/web/public/phage.db packages/web/public/phage.db.manifest.json; then
            echo "No changes to database"
            exit 0
          fi

          git add packages/web/public/phage.db packages/web/public/phage.db.manifest.json
          git commit -m "chore: update phage annotations [automated]" \
            -m "Updated via the annotation workflow: protein domains, AMG mappings, and host tRNA data."

          git pull --rebase origin main
          git push origin HEAD:main

      - name: Upload annotation diagnostics
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: annotation-diagnostics
          path: |
            packages/data-pipeline/phage.db
            packages/web/public/phage.db.manifest.json
          if-no-files-found: warn
          retention-days: 7
